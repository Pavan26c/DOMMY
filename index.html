        <style>
    .dropzone {
        border: 2px dashed #888;
        border-radius: 8px;
        padding: 60px 20px;
        text-align: center;
        max-width: 600px;
        margin: 20px auto;
        transition: background 0.2s, border-color 0.2s;
    }
    .dropzone.dragover {
        background: #eef6ff;
        border-color: #1a73e8;
    }
    .dropzone label {
        color: #1a73e8;
        cursor: pointer;
    }
    #file-input {
        display: none;
    }
</style>

<div class="dropzone" id="dropzone">
    <h3>Drag your resume here</h3>
    <p>Or <label for="file-input">choose your file</label></p>
    <p id="file-name"></p>
    <input type="file" id="file-input" accept=".pdf" />
</div>

<script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const fileName = document.getElementById("file-name");

    // Prevent the browser from opening the file when dropped
    ["dragenter", "dragover", "dragleave", "drop"].forEach(evt => {
        dropzone.addEventListener(evt, e => e.preventDefault());
    });

    // Highlight the box while dragging over it
    ["dragenter", "dragover"].forEach(evt => {
        dropzone.addEventListener(evt, () => dropzone.classList.add("dragover"));
    });
    ["dragleave", "drop"].forEach(evt => {
        dropzone.addEventListener(evt, () => dropzone.classList.remove("dragover"));
    });

    // Handle a dropped file
    dropzone.addEventListener("drop", e => {
        const file = e.dataTransfer.files[0];
        handleFile(file);
    });

    // Handle a file picked through the dialog
    fileInput.addEventListener("change", () => {
        handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
        if (!file) return;
        if (file.type !== "application/pdf") {
            fileName.textContent = "Please upload a PDF file.";
            return;
        }
        fileName.textContent = "Selected: " + file.name;
    }
</script>
